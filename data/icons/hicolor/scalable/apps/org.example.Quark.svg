<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9f7aea"/>
      <stop offset="1" stop-color="#5b2fc9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a24a8"/>
      <stop offset="1" stop-color="#36197d"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="62" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6dcff"/>
    </linearGradient>
  </defs>
  <!-- tile with GNOME-style depth -->
  <rect x="10" y="16" width="108" height="100" rx="24" fill="url(#edge)"/>
  <rect x="10" y="10" width="108" height="100" rx="24" fill="url(#tile)"/>
  <rect x="10.5" y="10.5" width="107" height="99" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="64" cy="62" r="34" fill="url(#glow)"/>
  <!-- three bound quarks -->
  <path d="M64 36 L41 76 L87 76 Z" fill="none" stroke="#ffffff" stroke-opacity="0.42"
        stroke-width="5" stroke-linejoin="round"/>
  <circle cx="64" cy="36" r="12" fill="url(#orb)"/>
  <circle cx="41" cy="76" r="12" fill="url(#orb)"/>
  <circle cx="87" cy="76" r="12" fill="url(#orb)"/>
</svg>
