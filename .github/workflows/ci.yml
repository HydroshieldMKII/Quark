name: ci
on:
  push:
  pull_request:
  #schedule:
  #  - cron: "0 3 * * *" # nightly soak

jobs:
  core:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      # The FUSE tests need /dev/fuse; without it they skip and the fusefs coverage gate fails.
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install golang gcc git make dbus-daemon fuse3 python3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: PATH=$PATH:$HOME/go/bin make test
      - run: PATH=$PATH:$HOME/go/bin make fuzz FUZZTIME=20s

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the first run compiles gotk4 cold (~20 min); later runs reuse the cache
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install golang gcc git make gtk4-devel libadwaita-devel gobject-introspection-devel mutter dbus-daemon
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ui-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: go-ui-${{ hashFiles('go.sum') }}-
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: PATH=$PATH:$HOME/go/bin make lint
      - run: make build
      - run: make test-ui
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Needs the GTK packages, so it runs here and not in the core job.
      - run: PATH=$PATH:$HOME/go/bin make vuln
      # Save even when a step fails, so a timeout does not throw the compiled gotk4 away.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ui-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install golang gcc git make
      - run: make soak SOAKTIME=30m
