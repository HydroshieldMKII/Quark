name: ci
on:
  push:
    branches: [main] # branches are covered by their pull request, not twice
  pull_request:
  #schedule:
  #  - cron: "0 3 * * *" # nightly soak

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the expensive jobs are needed. The workflow always runs, so required status
  # checks never wait forever: a skipped job counts as passed. Docs-only changes skip core and ui.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          code=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Files whose change cannot affect the build or the tests.
            docs='^(.*\.md|docs/.*|LICENSE|\.editorconfig|\.gitignore|\.githooks/.*|\.claude/.*|\.specify/.*|\.github/(ISSUE_TEMPLATE/.*|pull_request_template\.md|CODEOWNERS))$'
            if ! git diff --name-only "$base" HEAD | grep -vE "$docs" | grep -q .; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      # The FUSE tests need /dev/fuse; without it they skip and the fusefs coverage gate fails.
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install golang gcc git make dbus-daemon fuse3 python3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: PATH=$PATH:$HOME/go/bin make test
      - run: PATH=$PATH:$HOME/go/bin make fuzz FUZZTIME=20s

  ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the first run compiles gotk4 cold (~20 min); later runs reuse the cache
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install golang gcc git make gtk4-devel libadwaita-devel gobject-introspection-devel mutter dbus-daemon
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ui-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-ui-${{ hashFiles('go.sum') }}-
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: PATH=$PATH:$HOME/go/bin make lint
      - run: make build
      - run: |
          # mutter needs a private runtime dir; the container has none.
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          make test-ui
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Needs the GTK packages, so it runs here and not in the core job.
      - run: PATH=$PATH:$HOME/go/bin make vuln
      # Save even when a step fails, so a timeout does not throw the compiled gotk4 away.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ui-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install golang gcc git make
      - run: make soak SOAKTIME=30m
