name: ci
on:
  push:
    branches: [main]
  pull_request:
  #schedule:
  #  - cron: "0 3 * * *" # nightly soak

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # core skips docs-only changes; ui also skips mount-only and tooling changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          code=true
          ui=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            inert='^(.*\.md|docs/.*|LICENSE|\.editorconfig|\.gitignore|\.githooks/.*|\.claude/.*|\.specify/.*|\.github/(ISSUE_TEMPLATE/.*|pull_request_template\.md|CODEOWNERS|dependabot\.yml|workflows/(release|dependabot-automerge)\.yml))$'
            no_ui='^(internal/fusefs/.*|cmd/quark-mount/.*|tools/.*|e2e/.*|data/nautilus/.*|data/quark-mount\.service)$'
            files=$(git diff --name-only "$base" HEAD)
            echo "$files" | grep -vE "$inert" | grep -q . || code=false
            echo "$files" | grep -vE "$inert|$no_ui" | grep -q . || ui=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "code=$code ui=$ui"

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dnf -y install golang gcc git make dbus-daemon fuse3 python3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: PATH=$PATH:$HOME/go/bin make test
      - run: PATH=$PATH:$HOME/go/bin make fuzz FUZZTIME=20s

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dnf -y install golang gcc git make gtk4-devel libadwaita-devel gobject-introspection-devel mutter dbus-daemon
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ui-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-ui-${{ hashFiles('go.sum') }}-
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: PATH=$PATH:$HOME/go/bin make lint
      - run: make build
      - run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          make test-ui
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: PATH=$PATH:$HOME/go/bin make vuln
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ui-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dnf -y install golang gcc git make
      - run: make soak SOAKTIME=30m
